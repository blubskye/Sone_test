plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.noarg' version '2.1.20'
    id 'info.solidsoft.pitest' version '1.19.0'
}

import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

group = 'net.pterodactylus'
version = '82'

apply plugin: 'java'

repositories {
    mavenCentral()
    maven { url "https://maven.pterodactylus.net/" }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "11"
    }
}

// Make compileOnly (provided) deps visible on the test compile/runtime classpath.
configurations {
    testImplementation.extendsFrom(compileOnly)
}

dependencies {
    // Provided by Freenet at runtime — do NOT bundle in fatJar.
    compileOnly files('/run/media/blubskye/3cf92542-a690-4c82-8a30-19a30ca2ce5a/fred_bk/build/libs/freenet.jar')
    compileOnly group: 'org.freenetproject', name: 'freenet-ext', version: '29'
    compileOnly group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.83'

    // Bundled into fatJar
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib'
    implementation group: 'org.jetbrains.kotlinx', name: 'kotlinx-coroutines-core', version: '1.10.1'
    implementation group: 'net.pterodactylus', name: 'utils', version: '0.13.1'
    implementation group: 'com.google.inject', name: 'guice', version: '6.0.0'
    implementation group: 'com.google.guava', name: 'guava', version: '33.4.0-jre'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.3'
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: '2.18.3'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.18.3'
    implementation group: 'io.dropwizard.metrics', name: 'metrics-core', version: '4.2.29'
    implementation group: 'javax.activation', name: 'javax.activation-api', version: '1.2.0'

    testImplementation group: 'org.jetbrains.kotlin', name: 'kotlin-test-junit'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.14.2'
    testImplementation group: 'org.hamcrest', name: 'hamcrest', version: '3.0'
    testImplementation group: 'org.objenesis', name: 'objenesis', version: '3.4'
}

apply from: 'version.gradle'

task parallelTest(type: Test) {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    useJUnit {
        excludeCategories 'net.pterodactylus.sone.test.NotParallel'
    }
}

task notParallelTest(type: Test) {
    maxParallelForks = 1
    useJUnit {
        includeCategories 'net.pterodactylus.sone.test.NotParallel'
    }
    dependsOn parallelTest
}

test {
    exclude '**'
    dependsOn parallelTest, notParallelTest
}

task fatJar(type: Jar) {
    archiveFileName = project.name.toLowerCase() + '-jar-with-dependencies.jar'
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest {
        attributes('Plugin-Main-Class': 'net.pterodactylus.sone.main.SonePlugin')
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

javadoc {
    options {
        quiet()
        showFromPrivate()
        footer('© 2010–2013 David \'Bombe\' Roden')
        links('https://docs.oracle.com/en/java/javase/11/docs/api/')
    }
    failOnError = false
}

apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport.dependsOn test

pitest {
    pitestVersion = '1.23.0'
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    timeoutFactor = 3.0
}

apply plugin: 'idea'

task countLinesMain(type: Exec) {
    executable = 'cloc'
    args = ['--by-file', '--xml', '--report-file=build/reports/cloc/main.xml', 'src/main']
    standardOutput = new ByteArrayOutputStream()
}

task countLinesTest(type: Exec) {
    executable = 'cloc'
    args = ['--by-file', '--xml', '--report-file=build/reports/cloc/test.xml', 'src/test']
    standardOutput = new ByteArrayOutputStream()
}

task countLines {
    new File(buildDir, "reports/cloc").mkdirs()
    dependsOn tasks.countLinesMain
    dependsOn tasks.countLinesTest
}

noArg {
    annotation('net.pterodactylus.sone.main.NoArg')
}
