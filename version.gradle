task(writeVersion) {
    doLast {
        def commitId   = "unknown"
        def niceVersion = "v82-local"
        try {
            def idProc = ["git", "rev-parse", "HEAD"].execute([], project.rootDir)
            idProc.waitFor()
            if (idProc.exitValue() == 0) { commitId = idProc.text.trim() }

            def descProc = ["git", "describe", "--always", "--tags"].execute([], project.rootDir)
            descProc.waitFor()
            if (descProc.exitValue() == 0) { niceVersion = descProc.text.trim() }
        } catch (Exception ignored) {}

        project.file("src/generated/resources").mkdirs()
        project.file("src/generated/resources/version.yaml").withWriter { out ->
            out.println "id: ${commitId}"
            out.println "nice: ${niceVersion}"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += "src/generated/resources"
        }
    }
}

processResources {
    dependsOn(writeVersion)
}
