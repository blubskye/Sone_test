task(writeVersion) {
    doLast {
        def version = "unknown"
        def niceVersion = "v82-custom"

        try {
            def gitRevResult = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', 'HEAD'
                standardOutput = gitRevResult
                ignoreExitValue = true
            }
            version = gitRevResult.toString().trim()

            def gitDescResult = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'describe', '--tags', '--always'
                standardOutput = gitDescResult
                ignoreExitValue = true
            }
            niceVersion = gitDescResult.toString().trim() ?: "v82-custom"
        } catch (Exception e) {
            // Use defaults if git not available
        }

        new File(project.rootDir, "src/generated/resources").mkdirs()
        project.file("src/generated/resources/version.yaml").withWriter { out ->
            out.println "id: ${version}"
            out.println "nice: ${niceVersion}"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += "src/generated/resources"
        }
    }
}

processResources {
    dependsOn(writeVersion)
}
